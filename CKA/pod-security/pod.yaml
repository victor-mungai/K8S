apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: restricted-ns
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
    runAsNonRoot: true
    fsGroup: 2000
  volumes:
    - name: sec-vol
      emptyDir: {}
  containers:
    - name: app
      image: busybox
      command: ["sh","-c"]
      args: ["sleep 1h"]
      securityContext:
        capabilities:
          add: ["NET_ADMIN","SYS_TIME"]
          drop: ["ALL"]
      volumeMounts:
        - name: sec-vol
          mountPath: /data/sec
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: 
            - ALL 
